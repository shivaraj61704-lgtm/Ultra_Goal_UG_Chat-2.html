 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Ultra Goal AI | UG Chat</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #f5f6fa;
  --panel2: #e9ecf4;
  --text: #202431;
  --muted: #737b8c;
  --line: #e1e5ed;
  --accent: #4169e1;
  --user: #edf1fa;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111318;
  --panel: #191c23;
  --panel2: #282d38;
  --text: #edf0f6;
  --muted: #a0a7b5;
  --line: #303541;
  --accent: #91a9ff;
  --user: #272d3a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}

button, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app { display: flex; height: 100dvh; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 12px;
  background: var(--panel);
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px;
  font-size: 17px;
  font-weight: 800;
}

.logo {
  display: grid;
  place-items: center;
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, #3278ee, #9560e9);
  color: white;
  font-weight: 900;
}

.brand span { color: var(--accent); }

.side-button, .new-chat {
  width: 100%;
  padding: 11px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--text);
  background: var(--bg);
}

.new-chat { background: var(--panel2); font-weight: 700; }

.history-label {
  margin-top: 8px;
  padding: 0 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

.history {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: stretch;
  gap: 5px;
  min-width: 0;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
}

.history-item {
  display: block;
  flex: 0 0 auto;
  width: 100%;
  min-width: 0;
  padding: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: left;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 13px;
}

.history-item:hover, .history-item.active {
  background: var(--panel2);
  border-color: var(--line);
}

.muted { color: var(--muted); font-size: 12px; padding: 8px; }
.side-bottom { display: grid; gap: 7px; margin-top: auto; }

.main {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 66px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
}

.heading { font-weight: 800; font-size: 16px; }

.mode-switch {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.mode-btn {
  padding: 8px 11px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 750;
}

.mode-btn.active {
  background: var(--accent);
  color: white;
}

.icon-button {
  padding: 9px 11px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px;
  scroll-behavior: smooth;
}

.welcome {
  display: flex;
  min-height: 100%;
  max-width: 760px;
  margin: auto;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.welcome-logo {
  display: grid;
  place-items: center;
  width: 66px;
  height: 66px;
  margin-bottom: 20px;
  color: white;
  background: linear-gradient(135deg, #3278ee, #9560e9);
  border-radius: 22px;
  font-size: 22px;
  font-weight: 900;
}

.welcome h1 {
  margin: 0 0 12px;
  font-size: clamp(28px, 4vw, 43px);
  line-height: 1.15;
}

.gradient {
  color: var(--accent);
}

.welcome p {
  max-width: 550px;
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 650px;
  margin-top: 20px;
  text-align: left;
}

.suggestion {
  min-height: 84px;
  padding: 14px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 13px;
  text-align: left;
}

.suggestion:hover { border-color: var(--accent); }

.suggestion strong {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
}

.suggestion span { color: var(--muted); font-size: 12px; }

.messages {
  display: flex;
  flex-direction: column;
  gap: 23px;
  width: 100%;
  max-width: 820px;
  margin: auto;
  padding-bottom: 20px;
}

.message { min-width: 0; }

.user-message {
  display: flex;
  justify-content: flex-end;
}

.user-bubble {
  max-width: 85%;
  padding: 12px 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--user);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.7;
  font-size: 14px;
}

.ai-message { display: flex; align-items: flex-start; gap: 10px; }

.ai-logo {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  flex-shrink: 0;
  color: white;
  background: linear-gradient(135deg, #3278ee, #9560e9);
  border-radius: 10px;
  font-size: 10px;
  font-weight: 900;
}

.answer {
  min-width: 0;
  flex: 1;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.8;
}

.answer p { margin: 0 0 12px; }
.answer h1, .answer h2, .answer h3 { line-height: 1.35; }
.answer pre {
  max-width: 100%;
  overflow-x: auto;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  line-height: 1.6;
}
.answer code {
  font-family: Consolas, "Courier New", monospace;
  font-size: .92em;
}
.answer :not(pre) > code {
  padding: 2px 5px;
  background: var(--panel2);
  border-radius: 5px;
}
.answer table { display: block; overflow-x: auto; border-collapse: collapse; }
.answer td, .answer th { border: 1px solid var(--line); padding: 7px; }
.answer a { color: var(--accent); }

.message-actions { display: flex; gap: 7px; margin-top: 9px; }

.message-actions button {
  padding: 5px 8px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 7px;
  font-size: 11px;
}

.message-actions button:hover { background: var(--panel2); color: var(--text); }

.composer-wrap { padding: 10px 16px 14px; }

.composer {
  max-width: 820px;
  margin: auto;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 8px 30px #0000000b;
}

#prompt {
  display: block;
  width: 100%;
  min-height: 30px;
  max-height: 180px;
  resize: vertical;
  padding: 6px;
  color: var(--text);
  background: transparent;
  border: 0;
  outline: 0;
  font-size: 14px;
  line-height: 1.6;
}

.composer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.tools { display: flex; flex-wrap: wrap; gap: 5px; }

.tool-button {
  padding: 7px 9px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 8px;
  font-size: 12px;
}

.tool-button:hover { background: var(--panel); color: var(--text); }

.send {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  color: white;
  background: var(--accent);
  border: 0;
  border-radius: 50%;
  font-size: 20px;
}

.disclaimer {
  margin: 8px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.toast {
  position: fixed;
  z-index: 10;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  padding: 11px 15px;
  color: var(--bg);
  background: var(--text);
  border-radius: 10px;
  font-size: 12px;
}

.hidden { display: none !important; }

@media (max-width: 760px) {
  .sidebar {
    position: fixed;
    z-index: 20;
    top: 0;
    bottom: 0;
    left: 0;
    width: 270px;
    transform: translateX(-105%);
    transition: transform .2s;
    box-shadow: 10px 0 35px #0002;
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-overlay {
    position: fixed;
    z-index: 19;
    inset: 0;
    background: #0007;
  }
  .mobile-overlay.show { display: block; }
  .menu-button { display: inline-block !important; }
  .topbar { padding: 10px; flex-wrap: wrap; }
  .chat-area { padding: 15px 12px; }
  .composer-wrap { padding: 8px; }
  .suggestions { grid-template-columns: 1fr; }
  .suggestion { min-height: 65px; }
}

@media (max-width: 430px) {
  .mode-btn { padding: 8px 7px; font-size: 11px; }
  .heading { font-size: 14px; }
}

.menu-button { display: none; }
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">UG</div>
      <div>Ultra <span>Goal</span></div>
    </div>

    <button class="new-chat" id="newChat">＋ New chat</button>

    <div class="history-label">💬 Recent chats</div>
    <div class="history" id="history"></div>

    <div class="side-bottom">
      <button class="side-button" id="themeSide">🌙 Dark mode</button>
      <button class="side-button" id="exportBtn">📥 Export conversations</button>
      <button class="side-button" id="clearHistoryBtn">🗑️ Clear history</button>
      <div class="muted">UG AI Chat · Dream big. Build smart. 🚀</div>
    </div>
  </aside>

  <div class="mobile-overlay hidden" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:9px">
        <button class="icon-button menu-button" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="heading">UG Chat ✨</div>
      </div>

      <div class="mode-switch" role="group" aria-label="Chat mode">
        <button class="mode-btn active" id="normalModeBtn" aria-pressed="true">
          💬 Normal
        </button>
        <button class="mode-btn" id="programmingModeBtn" aria-pressed="false">
          💻 Programming
        </button>
      </div>

      <button class="icon-button" id="themeTop" aria-label="Toggle dark mode">🌙</button>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">UG</div>
        <h1>What can I help you <span class="gradient">build?</span></h1>
        <p id="welcomeText">
          Welcome to Ultra Goal! 😊 Ask questions, learn new skills,
          explore AI, and turn your ideas into reality.
        </p>

        <div class="suggestions" id="suggestions">
          <button class="suggestion" data-prompt="Explain artificial intelligence in simple English.">
            <strong>🧠 Explore AI</strong>
            <span>Understand AI step by step</span>
          </button>
          <button class="suggestion" data-prompt="Teach me Python basics with examples and exercises.">
            <strong>🐍 Learn Python</strong>
            <span>Start your coding journey</span>
          </button>
          <button class="suggestion" data-prompt="Teach me C programming basics with a simple example.">
            <strong>💻 Learn C</strong>
            <span>Understand programming fundamentals</span>
          </button>
          <button class="suggestion" data-prompt="Give me a beginner robotics project idea using free tools.">
            <strong>🤖 Build something</strong>
            <span>Turn ideas into projects</span>
          </button>
        </div>
      </div>

      <div class="messages hidden" id="messages" aria-live="polite"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="prompt" rows="1" maxlength="30000"
          placeholder="Message Ultra Goal..." aria-label="Your message"></textarea>

        <div class="composer-bottom">
          <div class="tools">
            <button class="tool-button" type="button" id="clearInput">🧹 Clear</button>
            <button class="tool-button" type="button" id="stopBtn" disabled>⏹ Stop</button>
          </div>
          <button class="send" id="sendBtn" type="submit" aria-label="Send message" disabled>↑</button>
        </div>
      </form>
      <div class="disclaimer">
        AI can make mistakes. Check important information and test code before using it. ❤️
      </div>
    </div>
  </main>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const WORKER_URL =
  "https://ultra-goal-ai.shivaraj61704.workers.dev/";

const STORAGE_KEY = "ultraGoalChatsV3";
const THEME_KEY = "ultraGoalTheme";

let chats = [];
let activeChatId = null;
let chatMode = "normal";
let activeController = null;
let toastTimer = null;

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.add("hidden"), 2800);
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats.slice(0, 50)));
  } catch (error) {
    showToast("⚠️ Could not save chat history in this browser.");
  }
}

function activeChat() {
  return chats.find(chat => chat.id === activeChatId) || null;
}

function setMode(mode) {
  chatMode = mode === "programming" ? "programming" : "normal";

  const programming = chatMode === "programming";

  $("normalModeBtn").classList.toggle("active", !programming);
  $("programmingModeBtn").classList.toggle("active", programming);

  $("normalModeBtn").setAttribute("aria-pressed", String(!programming));
  $("programmingModeBtn").setAttribute("aria-pressed", String(programming));

  $("prompt").placeholder = programming
    ? "Ask about Python, C, debugging, or algorithms..."
    : "Message Ultra Goal...";

  $("welcomeText").textContent = programming
    ? "💻 Programming mode is ready! Learn Python and C, debug errors, understand algorithms, and build working programs step by step."
    : "Welcome to Ultra Goal! 😊 Ask questions, learn new skills, explore AI, and turn your ideas into reality.";

  $("suggestions").innerHTML = programming
    ? `<button class="suggestion" data-prompt="Teach me Python from basics with a runnable example.">
         <strong>🐍 Python tutor</strong><span>Learn syntax and logic</span>
       </button>
       <button class="suggestion" data-prompt="Teach me C programming from basics with a runnable example.">
         <strong>💻 C programming</strong><span>Learn C step by step</span>
       </button>
       <button class="suggestion" data-prompt="Give me 5 beginner Python exercises with answers and explanations.">
         <strong>🧩 Coding practice</strong><span>Build problem-solving skills</span>
       </button>
       <button class="suggestion" data-prompt="Explain how to debug a program and show a simple example in Python and C.">
         <strong>🐞 Debugging</strong><span>Find and fix errors</span>
       </button>`
    : `<button class="suggestion" data-prompt="Explain artificial intelligence in simple English.">
         <strong>🧠 Explore AI</strong><span>Understand AI step by step</span>
       </button>
       <button class="suggestion" data-prompt="Teach me Python basics with examples and exercises.">
         <strong>🐍 Learn Python</strong><span>Start your coding journey</span>
       </button>
       <button class="suggestion" data-prompt="Explain an interesting mathematics concept with a simple example.">
         <strong>📘 Learn something</strong><span>Explore a new topic</span>
       </button>
       <button class="suggestion" data-prompt="Give me a beginner robotics project idea using free tools.">
         <strong>🤖 Build something</strong><span>Turn ideas into projects</span>
       </button>`;

  $("suggestions").querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      $("prompt").value = button.dataset.prompt;
      resizeInput();
      sendMessage();
    });
  });

  showToast(programming
    ? "💻 Programming mode enabled — Python + C!"
    : "💬 Normal chat mode enabled!");
}

$("normalModeBtn").addEventListener("click", () => setMode("normal"));
$("programmingModeBtn").addEventListener("click", () => setMode("programming"));

function renderHistory() {
  const history = $("history");
  history.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement("div");
    empty.className = "muted";
    empty.textContent = "Your conversations will appear here. 💬";
    history.appendChild(empty);
    return;
  }

  chats.slice(0, 50).forEach(chat => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "history-item" +
      (chat.id === activeChatId ? " active" : "");

    const title = (chat.title || "New chat").trim();
    button.textContent = title === "New chat" ? "💬 New chat" : "✨ " + title;
    button.title = title;
    button.addEventListener("click", () => showChat(chat.id));

    history.appendChild(button);
  });
}

function showWelcome() {
  $("welcome").classList.remove("hidden");
  $("messages").classList.add("hidden");
  $("messages").replaceChildren();
}

function createChat() {
  const chat = {
    id: Date.now().toString() + Math.random().toString(16).slice(2),
    title: "New chat",
    messages: []
  };

  chats.unshift(chat);
  activeChatId = chat.id;
  saveChats();
  renderHistory();
  showWelcome();

  $("prompt").value = "";
  resizeInput();
  closeSidebar();
  $("prompt").focus();
}

function showChat(id) {
  const chat = chats.find(item => item.id === id);
  if (!chat) return;

  activeChatId = id;
  $("welcome").classList.add("hidden");
  $("messages").classList.remove("hidden");
  $("messages").replaceChildren();

  chat.messages.forEach(message => renderMessage(message.role, message.text));

  renderHistory();
  scrollBottom();
  closeSidebar();
}

function formatMarkdown(text) {
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
    return null;
  }

  marked.setOptions({ gfm: true, breaks: true });
  return DOMPurify.sanitize(marked.parse(String(text)));
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showToast("📋 Copied!"))
      .catch(() => showToast("Copy was blocked by your browser."));
  } else {
    showToast("Clipboard is unavailable in this browser.");
  }
}

function renderMessage(role, text) {
  const row = document.createElement("div");
  row.className = "message";

  if (role === "user") {
    row.classList.add("user-message");

    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = text;

    row.appendChild(bubble);
  } else {
    row.classList.add("ai-message");

    const logo = document.createElement("div");
    logo.className = "ai-logo";
    logo.textContent = "UG";

    const column = document.createElement("div");
    column.style.minWidth = "0";
    column.style.flex = "1";

    const answer = document.createElement("div");
    answer.className = "answer";

    const html = formatMarkdown(text);
    if (html === null) answer.textContent = text;
    else answer.innerHTML = html;

    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "📋 Copy";
    copy.addEventListener("click", () => copyText(text));

    actions.appendChild(copy);
    column.append(answer, actions);
    row.append(logo, column);
  }

  $("messages").appendChild(row);
}

function scrollBottom() {
  $("chatArea").scrollTop = $("chatArea").scrollHeight;
}

function resizeInput() {
  const input = $("prompt");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  $("sendBtn").disabled = !input.value.trim() || !!activeController;
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("overlay").classList.add("hidden");
}

function addTyping() {
  const row = document.createElement("div");
  row.id = "typing";
  row.className = "ai-message";

  const logo = document.createElement("div");
  logo.className = "ai-logo";
  logo.textContent = "UG";

  const text = document.createElement("div");
  text.className = "answer";
  text.textContent = "✨ Ultra Goal is thinking...";

  row.append(logo, text);
  $("messages").appendChild(row);
}

function extractAnswer(data) {
  if (typeof data === "string") return data;

  const candidates = [
    data?.response,
    data?.reply,
    data?.text,
    data?.answer,
    data?.result?.response,
    data?.result?.text,
    data?.choices?.[0]?.message?.content
  ];

  return candidates.find(value =>
    typeof value === "string" && value.trim()
  ) || "";
}

async function sendMessage() {
  if (activeController) return;

  const input = $("prompt");
  const text = input.value.trim();
  if (!text) return;

  let chat = activeChat();

  if (!chat) {
    chat = {
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      title: text.slice(0, 36) || "New chat",
      messages: []
    };
    chats.unshift(chat);
    activeChatId = chat.id;
  }

  chat.messages.push({ role: "user", text });

  if (chat.title === "New chat") {
    chat.title = text.replace(/\s+/g, " ").slice(0, 36);
  }

  saveChats();
  renderHistory();

  $("welcome").classList.add("hidden");
  $("messages").classList.remove("hidden");
  $("messages").replaceChildren();

  chat.messages.forEach(message => renderMessage(message.role, message.text));

  input.value = "";
  resizeInput();

  addTyping();
  activeController = new AbortController();
  $("stopBtn").disabled = false;
  $("sendBtn").disabled = true;
  scrollBottom();

  try {
    const messages = chat.messages.slice(-30).map(message => ({
      role: message.role,
      content: message.text
    }));

    if (chatMode === "programming") {
      const codingInstructions =
        "PROGRAMMING MODE: You are an expert Python and C programming tutor. " +
        "Prioritize Python and C, not C++, unless requested. Give correct, " +
        "runnable code in fenced code blocks labelled python or c. Explain " +
        "the algorithm and important lines clearly. When useful, provide " +
        "sample input/output and time and space complexity. For debugging, " +
        "identify the likely cause and show the corrected complete code. " +
        "Prefer standard libraries and valid syntax. If a question is " +
        "ambiguous, state your assumption. Teach beginners step by step. " +
        "Never claim you ran or tested code unless you actually did.\n\n" +
        "User's request: ";

      const lastUserIndex = messages.map(m => m.role).lastIndexOf("user");

      if (lastUserIndex !== -1) {
        messages[lastUserIndex].content =
          codingInstructions + messages[lastUserIndex].content;
      }
    }

    const latestUser = [...messages].reverse().find(m => m.role === "user");
    const latestQuestion = latestUser?.content || text;

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "chat",
        message: latestQuestion,
        messages,
        mode: chatMode,
        programmingMode: chatMode === "programming",
        currentDateTime: new Date().toISOString()
      }),
      signal: activeController.signal
    });

    const raw = await response.text();
    let data;

    try {
      data = raw ? JSON.parse(raw) : {};
    } catch {
      data = { error: raw || "The server returned an invalid response." };
    }

    if (!response.ok) {
      throw new Error(
        [data.error, data.details, data.message, "HTTP " + response.status]
          .filter(Boolean).join(" — ")
      );
    }

    const answer = extractAnswer(data);

    if (!answer.trim()) {
      throw new Error(data.error || "The AI returned an empty answer.");
    }

    const current = chats.find(item => item.id === chat.id);

    if (current) {
      current.messages.push({ role: "assistant", text: answer.trim() });
      saveChats();
    }

    if (activeChatId === chat.id) {
      $("typing")?.remove();
      renderMessage("assistant", answer.trim());
      scrollBottom();
    }
  } catch (error) {
    $("typing")?.remove();

    if (error.name === "AbortError") {
      showToast("⏹ Response stopped.");
    } else {
      renderMessage(
        "assistant",
        "⚠️ I could not get an AI response.\n\n" +
        error.message + "\n\n" +
        "Please check that your Cloudflare Worker is deployed and " +
        "that its URL and AI configuration are correct."
      );
      scrollBottom();
    }
  } finally {
    activeController = null;
    $("stopBtn").disabled = true;
    resizeInput();
  }
}

$("chatForm").addEventListener("submit", event => {
  event.preventDefault();
  sendMessage();
});

$("prompt").addEventListener("input", resizeInput);

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});

$("newChat").addEventListener("click", createChat);

$("clearInput").addEventListener("click", () => {
  $("prompt").value = "";
  resizeInput();
  $("prompt").focus();
});

$("stopBtn").addEventListener("click", () => {
  if (activeController) activeController.abort();
});

$("suggestions").addEventListener("click", event => {
  const button = event.target.closest("[data-prompt]");
  if (!button) return;
  $("prompt").value = button.dataset.prompt;
  resizeInput();
  sendMessage();
});

$("menuBtn").addEventListener("click", () => {
  $("sidebar").classList.add("open");
  $("overlay").classList.remove("hidden");
  $("overlay").classList.add("show");
});

$("overlay").addEventListener("click", closeSidebar);

function applyTheme(theme) {
  const value = theme === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = value;

  $("themeTop").textContent = value === "dark" ? "☀️" : "🌙";
  $("themeSide").textContent =
    value === "dark" ? "☀️ Light mode" : "🌙 Dark mode";

  const meta = document.querySelector('meta[name="theme-color"]');
  meta.content = value === "dark" ? "#111318" : "#ffffff";

  try {
    localStorage.setItem(THEME_KEY, value);
  } catch (error) {
    // Theme still works for the current page.
  }
}

function toggleTheme() {
  applyTheme(
    document.documentElement.dataset.theme === "dark" ? "light" : "dark"
  );
}

$("themeTop").addEventListener("click", toggleTheme);
$("themeSide").addEventListener("click", toggleTheme);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(chats, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "ultra-goal-chat-history.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showToast("📥 Export started!");
});

$("clearHistoryBtn").addEventListener("click", () => {
  if (!confirm("Delete all saved conversations from this browser?")) return;

  if (activeController) activeController.abort();

  chats = [];
  activeChatId = null;
  saveChats();
  renderHistory();
  showWelcome();
  closeSidebar();
  showToast("🗑️ Chat history cleared.");
});

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    chats = Array.isArray(saved)
      ? saved.filter(chat =>
          chat &&
          typeof chat.id === "string" &&
          Array.isArray(chat.messages)
        )
      : [];
  } catch (error) {
    chats = [];
  }

  renderHistory();

  if (chats.length) {
    showChat(chats[0].id);
  } else {
    showWelcome();
  }
}

try {
  applyTheme(localStorage.getItem(THEME_KEY) || "light");
} catch (error) {
  applyTheme("light");
}

loadChats();
resizeInput();

document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    createChat();
  }

  if (event.key === "Escape") closeSidebar();
});
</script>
</body>
</html>
